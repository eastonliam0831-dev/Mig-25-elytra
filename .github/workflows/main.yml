
name: Build MIG-25 Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.8
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MIG-25-Elytra
          path: build/libs/*.jar
