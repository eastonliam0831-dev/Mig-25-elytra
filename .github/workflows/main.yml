
name: Build MIG-25 Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Gradle 9.8
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.8-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-9.8/bin/gradle" --version

      - name: Build Minecraft Mod
        run: |
          "$RUNNER_TEMP/gradle-9.8/bin/gradle" build --no-daemon

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MIG-25-Elytra
          path: build/libs/*.jar
