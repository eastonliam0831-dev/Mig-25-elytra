name: build-mod
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Download Gradle 9.8.0 and show version
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-9.8.0/bin/gradle" --version
      - name: Build
        run: '"$RUNNER_TEMP/gradle-9.8.0/bin/gradle" build --no-daemon'
      - uses: actions/upload-artifact@v4
        with:
          name: mig25-elytra
          path: build/libs/*.jar
